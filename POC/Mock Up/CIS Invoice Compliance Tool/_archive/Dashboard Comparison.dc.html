<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="assets/ds-modernist.css">
  <link rel="stylesheet" href="assets/ds-nocturne.css">
  <link rel="stylesheet" href="assets/ds-industry.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { margin: 0; background: #dcdcdc; font-family: system-ui, sans-serif; }
    .frame-label {
      position: absolute; top: -34px; left: 0; font: 600 13px system-ui, sans-serif;
      color: #333; display: flex; align-items: center; gap: 8px;
    }
    .frame-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%; background: #333; color: #fff;
      font-size: 11px; font-weight: 700;
    }
  </style>
</helmet>

<sc-for list="{{ frames }}" as="f" hint-placeholder-count="3">
  <div id="{{ f.id }}" style="position: absolute; left: {{ f.x }}px; top: {{ f.y }}px; width: 1440px;">
    <div class="frame-label"><span class="frame-badge">{{ f.badge }}</span>{{ f.name }}</div>
    <div class="{{ f.scope }}" style="width: 1440px; border-radius: 2px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.25);">
      <dc-import name="DashboardScreen" scope="{{ f.scope }}" icon-set="{{ f.iconSet }}" hint-size="1440px,1024px"></dc-import>
    </div>
  </div>
</sc-for>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      frames: [
        { id: '1a', badge: '1A', name: 'Modernist', scope: 'ds-modernist', iconSet: 'lucide', x: 0, y: 60 },
        { id: '1b', badge: '1B', name: 'Nocturne', scope: 'ds-nocturne', iconSet: 'phosphor', x: 1520, y: 60 },
        { id: '1c', badge: '1C', name: 'Industry', scope: 'ds-industry', iconSet: 'lucide-thin', x: 3040, y: 60 },
      ],
    };
  }
}

</script>
</body>
</html>
